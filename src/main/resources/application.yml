server:
  port: 8456
  servlet:
    context-path: /api
    session:
      timeout: 7d

xiamu:
  storage:
    root-path: data
    video-path: ${xiamu.storage.root-path}/videos
    audio-path: ${xiamu.storage.root-path}/audios
    max-file-size: 2GB
    allowed-formats: mp4,avi,mkv,webm
    cleanup-enabled: true
    cleanup-cron: 0 0 * * * ?
    video-retention-days: 7
    audio-retention-hours: 24
  whisper:
    # local: 调用本地 Python Whisper 脚本；api: 调用 OpenAI-compatible 远程转写接口
    mode: local
    # local 模式使用
    python-path: python
    script-path: scripts/whisper_openai.py
    # api 模式使用，建议通过环境变量注入
    api-key: ${WHISPER_API_KEY:}
    base-url: ${WHISPER_BASE_URL:https://api.openai.com}
    api-model: ${WHISPER_API_MODEL:whisper-1}
    api-timeout-seconds: 180
  ai:
    default-model: deepseek
    summary-model: ${AI_SUMMARY_MODEL:}
    chapter-model: ${AI_CHAPTER_MODEL:}
    summary-max-chars: 12000
    chapter-transcript-max-chars: 12000
    chapter-segments-max-chars: 16000
    models:
      openai:
        enabled: true
        provider: openai
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: 0.3
      deepseek:
        enabled: true
        provider: deepseek
        api-key: ${DEEPSEEK_API_KEY:sk-75b4c7f7ab2d4ad585373efcc6bba708}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        temperature: 0.3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.anwen.xiamubackend.controller
