spring:
  application:
    name: xiamu-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiamu
    username: root
    password: "011024"
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.3

server:
  port: 8456
  servlet:
    context-path: /api
    session:
      timeout: 7d

xiamu:
  storage:
    root-path: data
    video-path: ${xiamu.storage.root-path}/videos
    audio-path: ${xiamu.storage.root-path}/audios
    max-file-size: 2GB
    allowed-formats: mp4,avi,mkv,webm
    cleanup-enabled: true
    cleanup-cron: 0 0 * * * ?
    video-retention-days: 7
    audio-retention-hours: 24
  whisper:
    mode: local
    python-path: python
    script-path: scripts/whisper_openai.py
  ai:
    summary-max-chars: 12000
    chapter-transcript-max-chars: 12000
    chapter-segments-max-chars: 16000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.anwen.xiamubackend.controller
